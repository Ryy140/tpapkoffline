<style>
:root{--bg:#f3f4f9;--bg2:#e9ebf5;--fg:#171923;--mut:#697086;--card:#ffffff;--card2:#f8f9fc;--bd:#e1e4ee;--dash:#c5cadb;--pill:#171923;--pillfg:#fff;--ac:#e8317a;--ac2:#8b5cf6;--acs:rgba(232,49,122,.12);--inp:#eef0f6;--ok:#22c55e;--sh:0 1px 2px rgba(20,24,50,.04),0 8px 28px rgba(20,24,50,.07);--sh2:0 12px 40px rgba(20,24,50,.16);--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f15;--bg2:#13141c;--fg:#e8e9f0;--mut:#8b90a3;--card:#171923;--card2:#1b1e2a;--bd:#262a38;--dash:#3a3f54;--pill:#f1f2f7;--pillfg:#0e0f15;--ac:#ff4f93;--ac2:#a78bfa;--acs:rgba(255,79,147,.14);--inp:#101119;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);--sh2:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f15;--bg2:#13141c;--fg:#e8e9f0;--mut:#8b90a3;--card:#171923;--card2:#1b1e2a;--bd:#262a38;--dash:#3a3f54;--pill:#f1f2f7;--pillfg:#0e0f15;--ac:#ff4f93;--ac2:#a78bfa;--acs:rgba(255,79,147,.14);--inp:#101119;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);--sh2:0 12px 40px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--fg);font:14px/1.55 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 420px at 85% -10%,var(--acs),transparent 70%),radial-gradient(700px 380px at -5% 0%,rgba(139,92,246,.10),transparent 70%),var(--bg);background-attachment:fixed}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,label.b:focus-within{outline:2px solid var(--ac);outline-offset:2px}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 24px;height:62px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.025em;color:var(--fg);text-decoration:none}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 4px 14px var(--acs),inset 0 1px 0 rgba(255,255,255,.35)}
.logo .mk svg{width:17px;height:17px;display:block}
nav{display:flex;gap:2px;background:var(--inp);border:1px solid var(--bd);border-radius:11px;padding:3px}
nav a{padding:5px 15px;border-radius:8px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:500;transition:color .15s,background .15s}
nav a:hover{color:var(--fg)}
nav a.on{background:var(--pill);color:var(--pillfg);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sp{flex:1}
.ib{background:transparent;border:1px solid transparent;border-radius:9px;color:var(--mut);font:inherit;font-size:12px;font-weight:500;cursor:pointer;padding:6px 10px;display:flex;gap:6px;align-items:center;transition:background .15s,color .15s,border-color .15s}
.ib:hover{background:var(--card);border-color:var(--bd);color:var(--fg)}

/* layout */
main{flex:1;padding:34px 24px 40px;width:100%;max-width:1100px;margin:0 auto}
.intro{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:22px}
.intro [data-t=tag]{font-size:clamp(22px,3.6vw,32px);font-weight:600;letter-spacing:-.03em;line-height:1.2;color:var(--fg);max-width:620px}
.intro .mono{display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 11px}
.intro .mono::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
#view{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* drop zone */
.drop{position:relative;border:1.5px dashed var(--dash);background:linear-gradient(180deg,var(--card),var(--card2));border-radius:22px;padding:64px 22px;text-align:center;box-shadow:var(--sh);transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.drop:hover{border-color:var(--ac)}
.drop.over{border-color:var(--ac);background:linear-gradient(180deg,var(--acs),var(--card));transform:scale(1.01)}
.drop .ic{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:var(--acs);color:var(--ac)}
.drop .ic svg{width:32px;height:32px}
.drop h2{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.drop p{margin:0 0 22px;color:var(--mut);font-size:13.5px}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;margin:-6px 0 20px;color:var(--mut);font-size:12.5px;cursor:pointer}
.opt input{accent-color:var(--ac);width:16px;height:16px}
.choose{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drop .b.g{background:var(--card);color:var(--fg);border-color:var(--bd);box-shadow:none}
.drop .b.g:hover{border-color:var(--ac);color:var(--ac)}
.err{color:#e5484d;font-size:13px;margin-top:14px}
.err:empty{display:none}

/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pill);color:var(--pillfg);border:1px solid transparent;border-radius:10px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s;user-select:none}
.b:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.b:active{transform:translateY(0)}
.b.g{background:var(--card);color:var(--fg);border-color:var(--bd);box-shadow:none}
.b.g:hover{border-color:var(--ac);color:var(--ac);box-shadow:none}
.drop .b,#dp{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.drop .b{padding:11px 24px;font-size:14px;border-radius:12px;box-shadow:0 8px 22px var(--acs)}
input[type=file]{display:none}

/* toolbar */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--mut)}
.bar .mono{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;color:var(--fg);font-size:12px}
.chk{background:repeating-conic-gradient(rgba(120,128,150,.16) 0 25%,transparent 0 50%) 0/16px 16px,var(--card)}
.atl{display:inline-block;max-width:100%;min-width:min(100%,300px);padding:30px 16px;border:1px solid var(--bd);border-radius:var(--r);overflow:auto;max-height:70vh;vertical-align:top;box-shadow:var(--sh)}
.atl canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}

/* preview card */
.card{margin-top:24px;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:24px 26px 22px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.card .mut{margin:0 0 16px;font-size:12.5px;color:var(--mut);max-width:680px}
.stage{position:relative;border:1px solid var(--bd);border-radius:14px;overflow:hidden;height:340px}
.stage canvas{display:block;width:100%;height:100%}
.zm{position:absolute;top:10px;right:10px;display:flex;gap:2px;align-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:10px;padding:3px 4px;font-size:11px;box-shadow:var(--sh)}
.zm span{min-width:42px;text-align:center;color:var(--fg)}
.zm button,.st button{background:none;border:0;border-radius:6px;color:var(--mut);cursor:pointer;font:inherit;font-size:15px;line-height:1;width:26px;height:26px;display:grid;place-items:center;transition:background .12s,color .12s}
.zm button:hover{background:var(--inp);color:var(--fg)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0 14px;font-size:12px;color:var(--mut)}
.seg{display:flex;background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:500;padding:5px 11px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--pill);color:var(--pillfg);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.15)}
select,.n{background:var(--inp);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px}
select{cursor:pointer}
.n{width:72px;text-align:center}
.off{display:grid;grid-template-columns:16px 30px 1fr 30px 76px;gap:8px;align-items:center;max-width:420px;margin:8px 0;font-size:12px;color:var(--mut);text-transform:uppercase;font-weight:600}
.off button{width:30px;height:30px;background:var(--inp);border:1px solid var(--bd);border-radius:8px;color:var(--fg);cursor:pointer;font-size:15px;transition:border-color .12s,color .12s}
.off button:hover{border-color:var(--ac);color:var(--ac)}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;height:20px;background:transparent;width:100%;min-width:60px;cursor:pointer;accent-color:var(--ac)}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:var(--bd)}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:var(--bd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));border:2px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ac);border:2px solid var(--card)}

.cp{width:100%;max-width:420px;margin:12px 0 20px;display:block;background:var(--card2);color:var(--fg);border:1px dashed var(--dash);border-radius:10px;padding:9px;font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.cp:hover{border-color:var(--ac);color:var(--ac);background:var(--acs)}

/* playback */
.pb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.pb>button{width:36px;height:36px;background:var(--inp);border:1px solid var(--bd);border-radius:10px;color:var(--fg);cursor:pointer;font-size:13px;transition:border-color .12s,transform .1s}
.pb>button:hover{border-color:var(--ac)}
.pb>button:active{transform:scale(.94)}
.pb>#pp{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:15px;box-shadow:0 6px 16px var(--acs)}
.pb .inf{flex:1;min-width:170px;margin:0 6px}
.pb .inf b{font:600 13px "IBM Plex Mono",ui-monospace,monospace;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb .inf span{font-size:11.5px;color:var(--mut)}
.pb .sw{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);width:230px}

/* settings */
.gear{position:fixed;right:20px;bottom:calc(60px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--bd);color:var(--fg);font-size:20px;cursor:pointer;z-index:15;box-shadow:var(--sh2);transition:transform .25s,border-color .15s}
.gear:hover{transform:rotate(60deg);border-color:var(--ac)}
.pop{position:fixed;right:20px;bottom:calc(118px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;z-index:15;font-size:12px;font-weight:500;color:var(--mut);box-shadow:var(--sh2);animation:rise .2s ease both}
.pop[hidden]{display:none}
.pop input{width:170px;background:var(--inp);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;display:block;margin-top:5px}

/* unpack grid */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.list div{border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--card);font-size:10.5px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:transform .15s,border-color .15s,box-shadow .15s}
.list div:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:var(--sh)}
.gh{grid-column:1/-1;margin:10px 0 0;font:600 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--fg);display:flex;align-items:center;gap:8px}
.gh::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--ac),var(--ac2))}
.list div.pk{position:relative;cursor:pointer;opacity:.5}
.list div.pk.on{opacity:1;border-color:var(--ac)}
.list div.pk input{position:absolute;top:10px;left:10px;z-index:1;accent-color:var(--ac);width:17px;height:17px;cursor:pointer;margin:0;filter:drop-shadow(0 0 2px var(--card))}
.gh input{accent-color:var(--ac);width:16px;height:16px;cursor:pointer;margin:0}
.list div.empty{grid-column:1/-1;text-align:center;border:0;background:none;padding:22px;font-size:13px}
.list canvas{width:100%;height:68px;object-fit:contain;display:block;margin-bottom:6px;border-radius:6px;background:repeating-conic-gradient(rgba(120,128,150,.14) 0 25%,transparent 0 50%) 0/10px 10px}

.rel{position:relative;display:inline-block;max-width:100%;vertical-align:top;line-height:0}
.rel canvas{cursor:pointer}
.hl{position:absolute;border:2px solid var(--ac);background:rgba(232,49,122,.2);pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.hl[hidden]{display:none}
.hl span{position:absolute;left:0;bottom:calc(100% + 4px);background:var(--pill);color:var(--pillfg);font:600 11px "IBM Plex Mono",ui-monospace,monospace;padding:3px 8px;border-radius:7px;white-space:nowrap;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hl span.below{bottom:auto;top:calc(100% + 4px)}
.hl span.r{left:auto;right:0}
.fh h2 .cnt{font-size:12px;font-weight:500;color:var(--mut);background:var(--inp);border:1px solid var(--bd);border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.ftool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.ftool input[type=search]{flex:1;min-width:170px;background:var(--inp);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}
.ftool input[type=search]:focus{border-color:var(--ac)}
.b.dng{background:#e5484d;color:#fff}
.b.dng:hover{box-shadow:0 6px 16px rgba(229,72,77,.35)}
.b.busy{position:relative;pointer-events:none}
.b:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.fr{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:7px 9px;background:var(--card2);cursor:pointer;transition:border-color .12s,background .12s}
.fr:hover{border-color:var(--dash)}
.fr.on{border-color:var(--ac);background:var(--acs)}
.fr input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;cursor:pointer;flex:none}
.fr canvas{width:38px;height:38px;flex:none;border-radius:7px;background:repeating-conic-gradient(rgba(120,128,150,.18) 0 25%,transparent 0 50%) 0/10px 10px}
.fr .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.fr .nm b{font:600 12px "IBM Plex Mono",ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .nm small{color:var(--mut);font-size:10.5px}
.fr .x{flex:none;width:28px;height:28px;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:8px;cursor:pointer;font-size:13px;transition:all .12s}
.fr .x:hover{background:#e5484d;border-color:#e5484d;color:#fff}
.flist .empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:22px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:14px;background:var(--pill);color:var(--pillfg);padding:10px 12px 10px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--sh2);animation:rise .2s ease both}
#toast[hidden]{display:none}
.fr .ed{flex:none;width:28px;height:28px;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:8px;cursor:pointer;font-size:13px;transition:all .12s}
.fr .ed:hover{border-color:var(--ac);color:var(--ac)}
.list div.pk .ed{position:absolute;top:6px;right:6px;z-index:1;width:26px;height:26px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer;font-size:12px;padding:0}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,6vh) 16px 16px;overflow:auto}
.dlg{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 8px;font-size:16px}
.dlg label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.dlg input[type=text],.dlg input[type=number],.dlg select{width:100%;box-sizing:border-box;background:var(--inp);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px}
.dlg input:focus,.dlg select:focus{border-color:var(--ac);outline:none}
.dlg label.cb{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.dlg label.cb input{width:auto;accent-color:var(--ac)}
.dlg .row2{display:flex;gap:10px}.dlg .row2>div{flex:1;min-width:0}
.dlg [hidden]{display:none!important}
.dlg .pv{margin-top:12px;background:var(--card2);border:1px dashed var(--dash);border-radius:10px;padding:8px 10px;font:12px "IBM Plex Mono",ui-monospace,monospace;max-height:160px;overflow:auto;word-break:break-all;color:var(--mut)}
.dlg .pv b{color:var(--fg)}
.dlg .err{margin-top:12px;padding:8px 10px;border-radius:10px;background:rgba(229,72,77,.14);color:#e5484d;font-size:13px;font-weight:600;word-break:break-all}
.dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

#toast button{background:rgba(128,128,128,.25);color:inherit;border:0;border-radius:8px;padding:5px 12px;font:inherit;font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--bd);padding:16px 24px;font-size:11px;color:var(--mut);text-align:center}

/* logo */
.logo .mk{width:36px;height:36px;border-radius:10px;overflow:hidden;background:#0c1226;border:1px solid rgba(232,190,80,.55);box-shadow:0 4px 14px rgba(232,190,80,.22)}
.logo .mk img{width:100%;height:100%;object-fit:cover;display:block}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 22px}
.intro .it{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.intro .hero{width:168px;height:auto;border-radius:18px;border:1px solid rgba(232,190,80,.4);box-shadow:0 10px 34px rgba(232,190,80,.18),0 2px 8px rgba(0,0,0,.35);display:block}
@media(max-width:640px){
 .intro{gap:10px 14px}.intro .hero{width:92px;border-radius:12px}
 header{padding:0 14px;gap:10px}
 .logo span.t{display:none}
 nav a{padding:5px 10px}
 main{padding:22px 14px 30px}
 .card{padding:18px 16px}
 .drop{padding:44px 16px}
 .stage{height:260px}
 .pb .sw{width:100%}
 .gear{right:14px}.pop{right:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
